<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vitRemote</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
<style>
:root{--primary:#3d5afe;--on-primary:#fff;--pc:#dfe0ff;--on-pc:#00105c;--bg:#fbf8ff;--s1:#f3f1fb;--s2:#e9e7f3;--on:#1b1b21;--var:#46464f;--outline:#c6c5d0;--error:#ba1a1a;--ok:#1e8e3e}
@media (prefers-color-scheme:dark){:root{--primary:#b9c3ff;--on-primary:#11277f;--pc:#2c3e96;--on-pc:#dfe0ff;--bg:#121318;--s1:#1b1b21;--s2:#292a2f;--on:#e4e1e9;--var:#c6c5d0;--outline:#46464f;--error:#ffb4ab;--ok:#7dd99a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--on);font:400 14px/20px Roboto,system-ui,sans-serif}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-weight:normal;font-style:normal;white-space:nowrap;-webkit-font-smoothing:antialiased;font-feature-settings:'liga';user-select:none}
.app{height:100%;display:flex;gap:28px;padding:20px;justify-content:center;align-items:stretch}
.phone{height:100%;display:flex;gap:12px;align-items:center;min-width:0}
.col{height:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
#scr{flex:1;min-height:0;aspect-ratio:9/19.5;background:#000;border-radius:24px;overflow:hidden;position:relative;touch-action:none;user-select:none;box-shadow:0 2px 12px rgba(0,0,0,.25)}
#img{width:100%;height:100%;object-fit:contain;display:block;cursor:pointer;-webkit-user-drag:none}
#img:not([src]){visibility:hidden}
#ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#9a9aa6;pointer-events:none}
#ph .ms{font-size:40px}
.nav{display:flex;gap:4px;background:var(--s1);border-radius:28px;padding:4px}
.side{display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:none}
button::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
button:hover::after{opacity:.08}button:active::after,button.held::after{opacity:.16}
.ib{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--s1);color:var(--var)}
.nav .ib{width:68px;height:44px;border-radius:22px;background:none}
#pw{background:var(--pc);color:var(--on-pc)}
#pw .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--primary) var(--p,0%),transparent 0);-webkit-mask:radial-gradient(circle,transparent 21px,#000 22px);mask:radial-gradient(circle,transparent 21px,#000 22px)}
.panel{width:290px;display:flex;flex-direction:column;gap:12px;min-height:0}
.head{display:flex;align-items:center;gap:10px}
.head h1{font-size:22px;font-weight:400;margin:0}
.chip{margin-left:auto;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--outline);border-radius:8px;font-size:12px;font-weight:500;color:var(--var)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--error)}
.card{background:var(--s1);border-radius:20px;padding:6px 16px;overflow:auto;min-height:0}
.li{display:flex;gap:14px;align-items:center;padding:9px 0}
.li .ms{color:var(--primary);font-size:20px}
.li div{min-width:0;flex:1}
.li small{display:block;font-size:11px;color:var(--var);line-height:14px}
.li b{font-weight:400;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:3px;border-radius:2px;background:var(--s2);margin-top:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--primary)}
.kb{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--var);padding:0 4px}
.kb.on{color:var(--primary)}
#fps{font-size:11px;color:var(--var);height:14px}
@media (max-width:760px){.panel{display:none}.app{padding:12px}}
#login{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9}
.dialog{background:var(--s2);border-radius:28px;padding:24px;width:min(320px,90vw);text-align:center}
.dialog h2{font-size:22px;font-weight:400;margin:10px 0 18px}
.dialog input{width:100%;height:52px;border:1px solid var(--outline);border-radius:12px;background:none;color:inherit;font:inherit;font-size:22px;letter-spacing:.4em;text-align:center;outline:0}
.dialog input:focus{border:2px solid var(--primary)}
#lerr{color:var(--error);font-size:12px;min-height:18px;margin:6px 0}
.filled{background:var(--primary);color:var(--on-primary);height:40px;border-radius:20px;padding:0 24px;font-weight:500;width:100%}
#snack{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--on);color:var(--bg);padding:12px 16px;border-radius:6px;opacity:0;transition:.2s;pointer-events:none;z-index:10}
#snack.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="login"><div class="dialog">
 <span class="ms" style="color:var(--primary);font-size:32px">lock</span>
 <h2>Enter PIN</h2>
 <input id="pin" type="password" inputmode="numeric" maxlength="6" autofocus>
 <div id="lerr"></div>
 <button class="filled" onclick="login()">Connect</button>
</div></div>

<div class="app">
 <div class="phone">
  <div class="col">
   <div id="scr"><img id="img" alt=""><div id="ph"><span class="ms">screen_share</span><span id="phTxt">Connecting…</span></div></div>
   <div class="nav">
    <button class="ib" title="Back (Esc)" onclick="a('back')"><span class="ms">arrow_back_ios_new</span></button>
    <button class="ib" title="Home" onclick="a('home')"><span class="ms">radio_button_unchecked</span></button>
    <button class="ib" title="Recents" onclick="a('recents')"><span class="ms">check_box_outline_blank</span></button>
   </div>
   <div id="fps"></div>
  </div>
  <div class="side">
   <button class="ib" id="pw" title="Tap: lock / wake · Hold: power menu"><span class="ring"></span><span class="ms">power_settings_new</span></button>
   <button class="ib" id="vu" title="Volume up"><span class="ms">volume_up</span></button>
   <button class="ib" id="vd" title="Volume down"><span class="ms">volume_down</span></button>
   <button class="ib" title="Save screenshot" onclick="send('c')"><span class="ms">photo_camera</span></button>
  </div>
 </div>
 <div class="panel">
  <div class="head"><span class="ms" style="color:var(--primary)">cast</span><h1>vitRemote</h1><span class="chip"><i id="dot"></i><span id="stt">Offline</span></span></div>
  <div class="kb" id="kb"><span class="ms">keyboard</span><span>Type anywhere to send text</span></div>
  <div class="card" id="info"></div>
 </div>
</div>
<div id="snack"></div>

<script>
let ws,url=null,frames=0,bytes=0,retry=0,timer,lw=0;
const $=id=>document.getElementById(id);
const snack=m=>{const s=$('snack');s.textContent=m;s.classList.add('show');clearTimeout(s._h);s._h=setTimeout(()=>s.classList.remove('show'),2500)};
const send=m=>{if(ws&&ws.readyState==1)ws.send(m)};
const a=x=>send('a:'+x);
function login(){const p=$('pin').value.trim();if(!p)return;localStorage.pin=p;retry=0;connect()}
$('pin').addEventListener('keydown',e=>{e.stopPropagation();if(e.key=='Enter')login()});

function connect(){
 const pin=localStorage.pin;if(!pin)return;
 ws=new WebSocket(`ws://${location.host}/ws?k=${encodeURIComponent(pin)}`);
 ws.binaryType='arraybuffer';let opened=false;
 ws.onopen=()=>{opened=true;retry=0;$('login').style.display='none';setSt(1);lw=0;stream();
  clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)send('i')},4000)};
 ws.onclose=()=>{setSt(0);clearInterval(timer);
  if(!opened&&retry==0){$('login').style.display='flex';$('lerr').textContent='Wrong PIN or phone unreachable';retry=1;return}
  setTimeout(connect,Math.min(5000,500*++retry))};
 ws.onmessage=e=>{
  if(typeof e.data!='string'){
   const b=new Uint8Array(e.data),blob=new Blob([b.subarray(1)],{type:'image/jpeg'});
   if(b[0]==1){frames++;bytes+=b.length;const u=URL.createObjectURL(blob),im=$('img');im.onload=()=>{if(url&&url!=u)URL.revokeObjectURL(url);url=u};im.src=u;$('ph').style.display='none'}
   else{const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='screenshot_'+new Date().toISOString().replace(/[:.]/g,'-')+'.jpg';l.click();setTimeout(()=>URL.revokeObjectURL(u),5000);snack('Screenshot saved')}
   return}
  const d=JSON.parse(e.data);
  if(d.t=='info')showInfo(d);else if(d.t=='err'||d.t=='ok')snack(d.m)};
}
function setSt(on){$('dot').style.background=on?'var(--ok)':'var(--error)';$('stt').textContent=on?'Online':'Offline';if(!on){$('ph').style.display='flex';$('phTxt').textContent='Reconnecting…'}}

// Stream resolution follows the on-screen size; paused while the tab is hidden
function stream(){
 let w=0;if(!document.hidden){const px=$('scr').clientWidth*(devicePixelRatio||1);w=[360,540,720,1080].find(x=>x>=px*.9)||1080}
 if(w!=lw){lw=w;send('L:'+w)}
}
addEventListener('resize',()=>{clearTimeout(stream._t);stream._t=setTimeout(stream,300)});
document.addEventListener('visibilitychange',stream);
setInterval(()=>{if(lw)$('fps').textContent=frames?`${frames} fps · ${(bytes/1024).toFixed(0)} KB/s`:'Live · idle';frames=0;bytes=0},1000);

// Tap / long-press / swipe on the screen, wheel = scroll, right click = back
let down=null,wheelT=0;const img=$('img');
const pos=e=>{const r=img.getBoundingClientRect(),nw=img.naturalWidth||1,nh=img.naturalHeight||1,s=Math.min(r.width/nw,r.height/nh),w=nw*s,h=nh*s,l=r.left+(r.width-w)/2,t=r.top+(r.height-h)/2;
 return[Math.round(Math.min(1,Math.max(0,(e.clientX-l)/w))*1e4),Math.round(Math.min(1,Math.max(0,(e.clientY-t)/h))*1e4),e.clientX,e.clientY]};
img.addEventListener('pointerdown',e=>{if(e.button)return;e.preventDefault();img.setPointerCapture(e.pointerId);down=[...pos(e),performance.now()]});
img.addEventListener('pointerup',e=>{if(!down)return;const p=pos(e),dt=Math.round(performance.now()-down[4]),moved=Math.hypot(p[2]-down[2],p[3]-down[3])>8;
 if(!moved)send(dt>450?`l:${down[0]},${down[1]}`:`t:${down[0]},${down[1]}`);
 else send(`s:${down[0]},${down[1]},${p[0]},${p[1]},${Math.min(2000,Math.max(80,dt))}`);down=null});
img.addEventListener('wheel',e=>{e.preventDefault();const n=performance.now();if(n-wheelT<250)return;wheelT=n;const p=pos(e),d=e.deltaY>0?-2000:2000;
 send(`s:${p[0]},${p[1]},${p[0]},${Math.min(9500,Math.max(500,p[1]+d))},200`)},{passive:false});
img.addEventListener('contextmenu',e=>{e.preventDefault();a('back')});

// Power: tap = lock/wake, hold 0.6 s = power menu
(()=>{const b=$('pw');let t0,raf,fired;
 const loop=()=>{const p=Math.min(1,(performance.now()-t0)/600);b.style.setProperty('--p',p*100+'%');if(p>=1&&!fired){fired=true;a('power')}if(!fired)raf=requestAnimationFrame(loop)};
 b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);t0=performance.now();fired=false;b.classList.add('held');loop()};
 const end=()=>{if(t0==null)return;cancelAnimationFrame(raf);b.classList.remove('held');b.style.setProperty('--p','0%');if(!fired)send('P');t0=null};
 b.onpointerup=end;b.onpointercancel=()=>{cancelAnimationFrame(raf);t0=null;b.classList.remove('held');b.style.setProperty('--p','0%')};
})();
// Volume: hold to repeat
for(const[id,cmd]of[['vu','v:up'],['vd','v:down']]){const b=$(id);let t;
 b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);send(cmd);t=setTimeout(function r(){send(cmd);t=setTimeout(r,150)},450)};
 b.onpointerup=b.onpointercancel=()=>clearTimeout(t)}

// Physical keyboard => focused field on the phone
document.addEventListener('keydown',e=>{
 if($('login').style.display!='none'||e.ctrlKey||e.metaKey||e.altKey)return;
 let m=null;
 if(e.key=='Escape')m='a:back';else if(e.key=='Backspace')m='b';else if(e.key=='Enter')m='e';
 else if(e.key.length==1)m='x:'+e.key;
 if(m){e.preventDefault();send(m);flash()}});
document.addEventListener('paste',e=>{const t=e.clipboardData.getData('text');if(t){e.preventDefault();send('x:'+t);flash()}});
const flash=()=>{const k=$('kb');k.classList.add('on');clearTimeout(k._t);k._t=setTimeout(()=>k.classList.remove('on'),300)};

const fb=n=>n>=1e9?(n/1e9).toFixed(1)+' GB':(n/1e6).toFixed(0)+' MB';
const ft=s=>{const d=s/86400|0,h=s%86400/3600|0,m=s%3600/60|0;return(d?d+'d ':'')+h+'h '+m+'m'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showInfo(d){
 if(d.w&&d.h)$('scr').style.aspectRatio=`${d.w}/${d.h}`;
 const ru=d.ramTotal-d.ramAvail,du=d.diskTotal-d.diskFree;
 const it=(ic,label,val,p)=>`<div class="li"><span class="ms">${ic}</span><div><small>${label}</small><b title="${esc(val)}">${esc(val)}</b>${p!=null?`<div class="prog"><i style="width:${Math.round(p)}%"></i></div>`:''}</div></div>`;
 $('info').innerHTML=[
  it('smartphone','Device',d.model),
  it('android','Android',`${d.android} · API ${d.sdk}`),
  it(d.charging?'battery_charging_full':'battery_full','Battery',`${d.battery}%${d.charging?' · charging':''} · ${d.batTemp}°C`,d.battery),
  it('memory_alt','RAM',`${fb(ru)} / ${fb(d.ramTotal)}`,ru/d.ramTotal*100),
  it('hard_drive','Storage',`${fb(du)} / ${fb(d.diskTotal)}`,du/d.diskTotal*100),
  it('volume_up','Volume',`${d.vol}/${d.volMax}`,d.vol/d.volMax*100),
  it('wifi','IP',d.ip),
  it('schedule','Uptime',ft(d.uptime)),
 ].join('');
 stream();
}
if(localStorage.pin)connect();
</script>
</body>
</html>
